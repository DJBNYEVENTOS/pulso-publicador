name: Conectar Meta
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  conectar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Conectar páginas de Facebook e Instagram
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: node scripts/conectar-meta.mjs
      - name: Guardar
        run: |
          git config user.name "Pulso"
          git config user.email "pulso@users.noreply.github.com"
          git add config/meta.enc config/redes.json
          if ! git diff --cached --quiet; then git commit -m "Pulso: Meta conectado" && git push; fi
