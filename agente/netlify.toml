# Agente de WhatsApp de BNY Eventos. En Netlify: "Base directory" = agente
[build]
  command = "npm run build"
  publish = "publico"
  # Solo se vuelve a desplegar cuando cambia algo dentro de agente/ (el resto del repositorio cambia cada 15 min).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
